[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-clickjacking-lab"
version = "1.0.0"
description = "A reproducible local lab for clickjacking attacks, defenses, and automated auditing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Web Security Project Team" }
]
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Login>=0.6,<1",
  "Flask-Migrate>=4,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "PyYAML>=6.0,<7",
  "email-validator>=2.2,<3",
  "requests>=2.32.3,<3",
  "playwright>=1.59,<2",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
  "black>=24,<27",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]
report = ["matplotlib>=3.10,<4", "pillow>=11,<14", "imageio-ffmpeg>=0.6,<1", "pip-licenses>=5,<6", "markdown>=3.7,<4"]
qa = ["pymupdf>=1.25,<3"]

[project.scripts]
websec-lab = "websec_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
websec_lab = ["templates/*.html", "templates/*/*.html", "templates/*/*/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["websec_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

