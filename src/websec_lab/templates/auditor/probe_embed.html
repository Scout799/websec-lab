<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>loads:0</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background: #10141c;
        color: #dce3ec;
        display: flex; align-items: center; justify-content: center;
      }
      .stage { position: relative; width: 100%; height: 100%; display: flex;
               align-items: center; justify-content: center; overflow: hidden; }
      .meta { position: fixed; top: 10px; left: 12px; font-size: 12px; color: #8b97a8; z-index: 1; }
      .decoy-card {
        position: relative; z-index: 10; width: 340px; padding: 26px 22px;
        background: #fff; color: #23303f; border-radius: 12px; text-align: center;
        box-shadow: 0 12px 32px rgba(0,0,0,.45);
      }
      .decoy-card h2 { margin: 0 0 8px; font-size: 18px; }
      .decoy-card p { margin: 0 0 18px; color: #5a6b82; font-size: 13px; }
      .decoy-button {
        display: inline-block; min-width: 220px; padding: 13px 28px; border: 0;
        border-radius: 8px; background: #2f6fdb; color: #fff; font-size: 16px;
        font-weight: 700; cursor: pointer;
      }
      #target-frame { position: absolute; border: 0; background: transparent; z-index: 40; }
      .clip-window { position:absolute; z-index:40; width:260px; height:64px; overflow:hidden; }
      .visible-frame { position: static !important; width: 90vw !important;
                       height: 80vh !important; z-index: 1; opacity: 1 !important;
                       background: #fff; }
    </style>
  </head>
  <body>
    <p class="meta">probe harness · variant={{ variant }} · target host: {{ target_host }}</p>
    <div class="stage" id="stage">
      {% if variant in ('overlay', 'clip') %}
      <div class="decoy-card">
        <h2>恭喜！您已抽中今日专属大奖</h2>
        <p>点击下方按钮立即领取，奖品数量有限。</p>
        <button type="button" class="decoy-button" id="decoy-button">{{ decoy }}</button>
      </div>
      {% endif %}
      {% if variant == 'clip' %}<div class="clip-window" id="clip-window">{% endif %}
      <iframe id="target-frame"
              class="{{ 'visible-frame' if variant == 'visible' else '' }}"
              title="audit target"
              src="{{ target }}"
              style="width: {{ iframe_w }}px; height: {{ iframe_h }}px; opacity: {{ (1 if variant == 'clip' else opacity) if variant != 'visible' else 1 }};"></iframe>
      {% if variant == 'clip' %}</div>{% endif %}
    </div>
    <script>
      (function () {
        "use strict";
        var frame = document.getElementById("target-frame");
        var loads = 0;
        frame.addEventListener("load", function () {
          loads += 1;
          document.title = "loads:" + loads;
        });
        window.addEventListener("DOMContentLoaded", function () {
          document.title = "loads:" + loads;
          if ("{{ variant }}" === "visible") { return; }
          var stage = document.getElementById("stage");
          var decoy = document.getElementById("decoy-button");
          function align() {
            var stageRect = stage.getBoundingClientRect();
            var decoyRect = decoy.getBoundingClientRect();
            var cx = decoyRect.left + decoyRect.width / 2 - stageRect.left;
            var cy = decoyRect.top + decoyRect.height / 2 - stageRect.top;
            const clip = document.querySelector('#clip-window');
            if (clip) {
              clip.style.left = Math.round(cx - 130) + 'px';
              clip.style.top = Math.round(cy - 32) + 'px';
              frame.style.left = Math.round(130 - {{ iframe_w }} / 2) + 'px';
              frame.style.top = Math.round(32 - {{ iframe_h }} / 2) + 'px';
            } else {
              frame.style.left = Math.round(cx - {{ iframe_w }} / 2) + "px";
              frame.style.top = Math.round(cy - {{ iframe_h }} / 2) + "px";
            }
          }
          align();
          window.addEventListener("resize", align);
          window.addEventListener("pagehide", function () {});
          // 布局稳定兜底：字体就绪与延迟重对齐
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () { align(); });
          }
          [300, 800, 1500].forEach(function (ms) { setTimeout(align, ms); });
        });
      })();
    </script>
  </body>
</html>
